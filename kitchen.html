<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen – BrewDesk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --card: #222;
    --ink: #f0ede8;
    --muted: #888;
    --new: #ff4d4d;
    --accepted: #f5a623;
    --preparing: #4a9cf7;
    --ready: #2ecc71;
    --border: #333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  .top-bar {
    background: #111;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    color: #f5a623;
  }
  .live-dot {
    width: 10px; height: 10px;
    background: var(--ready);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .live-label { font-size: 13px; color: var(--muted); }

  .status-tabs {
    display: flex;
    gap: 6px;
  }
  .status-tab {
    padding: 7px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .status-tab:hover { border-color: #555; color: var(--ink); }
  .status-tab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .orders-board {
    padding: 20px 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    align-items: start;
  }

  .order-card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    border: 1.5px solid var(--border);
    transition: transform 0.2s;
  }
  .order-card:hover { transform: translateY(-2px); }

  .order-header {
    padding: 16px 18px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    background: #1a1a1a;
    border-bottom: 1px solid var(--border);
  }
  .table-id {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    line-height: 1;
    color: white;
  }
  .order-meta {
    text-align: right;
  }
  .order-ref {
    font-size: 13px;
    font-weight: 600;
    color: #f5a623;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .order-time { font-size: 11px; color: var(--muted); margin-bottom: 6px; }

  .status-badge {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .status-new { background: rgba(255,77,77,0.15); color: var(--new); border: 1px solid rgba(255,77,77,0.3); }
  .status-accepted { background: rgba(245,166,35,0.15); color: var(--accepted); border: 1px solid rgba(245,166,35,0.3); }
  .status-preparing { background: rgba(74,156,247,0.15); color: var(--preparing); border: 1px solid rgba(74,156,247,0.3); }
  .status-ready { background: rgba(46,204,113,0.15); color: var(--ready); border: 1px solid rgba(46,204,113,0.3); }

  .order-items {
    padding: 14px 18px;
  }
  .order-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .order-item-row:last-child { border-bottom: none; }
  .item-qty {
    background: #333;
    color: var(--ink);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    min-width: 28px;
    text-align: center;
    margin-right: 10px;
  }
  .item-label { flex: 1; font-size: 14px; }
  .item-notes { font-size: 11px; color: #f5a623; margin-left: 8px; font-style: italic; }

  .order-actions {
    padding: 12px 18px;
    display: flex;
    gap: 8px;
    background: #1a1a1a;
    border-top: 1px solid var(--border);
  }
  .action-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .action-btn:active { transform: scale(0.97); }

  .btn-accept { background: var(--accepted); color: #000; }
  .btn-prepare { background: var(--preparing); color: #000; }
  .btn-ready { background: var(--ready); color: #000; }
  .btn-served { background: #555; color: white; }

  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 80px 24px;
    color: var(--muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 18px; }

  .order-count-pill {
    background: var(--new);
    color: white;
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 12px;
    font-weight: 700;
    margin-left: 6px;
  }

  .sound-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .sound-btn.on { color: var(--ready); border-color: var(--ready); }
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <div class="logo">🍳 Kitchen</div>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="live-dot"></div>
      <span class="live-label">Live</span>
    </div>
  </div>
  <div class="status-tabs">
    <button class="status-tab active" onclick="filterStatus('active',this)">Active <span class="order-count-pill" id="count-active">0</span></button>
    <button class="status-tab" onclick="filterStatus('ready',this)">Ready</button>
    <button class="status-tab" onclick="filterStatus('all',this)">All Today</button>
  </div>
  <button class="sound-btn on" id="sound-toggle" onclick="toggleSound()">🔔 Sound On</button>
</div>

<div class="orders-board" id="orders-board">
  <div class="empty-state">
    <div class="empty-icon">🍽️</div>
    <div class="empty-text">No active orders</div>
  </div>
</div>

<script>
  let currentFilter = 'active';
  let soundEnabled = true;
  let lastOrderIds = new Set();

  // WebSocket for real-time updates
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${wsProto}//${location.host}`);

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.event === 'order:new' || msg.event === 'order:status' || msg.event === 'order:updated') {
      if (msg.event === 'order:new' && soundEnabled) playBeep();
      loadOrders();
    }
  };

  ws.onclose = () => setTimeout(() => location.reload(), 3000);

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start(); osc.stop(ctx.currentTime + 0.5);
    } catch(e) {}
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('sound-toggle');
    btn.textContent = soundEnabled ? '🔔 Sound On' : '🔕 Sound Off';
    btn.classList.toggle('on', soundEnabled);
  }

  async function loadOrders() {
    let url = '/api/orders?';
    if (currentFilter === 'active') url += 'status=new,accepted,preparing';
    else if (currentFilter === 'ready') url += 'status=ready';
    else url += 'date=' + new Date().toISOString().slice(0,10);

    const orders = await fetch(url).then(r => r.json());

    // Count truly active
    const active = orders.filter(o => ['new','accepted','preparing'].includes(o.status));
    document.getElementById('count-active').textContent = active.length;

    renderOrders(orders);
  }

  function renderOrders(orders) {
    const board = document.getElementById('orders-board');
    if (orders.length === 0) {
      board.innerHTML = `<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">All clear!</div></div>`;
      return;
    }

    board.innerHTML = orders.map(order => {
      const age = Math.floor((Date.now() - new Date(order.created_at).getTime()) / 60000);
      const ageStr = age < 1 ? 'Just now' : age + 'm ago';

      return `
        <div class="order-card" id="oc-${order.id}">
          <div class="order-header">
            <div class="table-id">${order.table_name}</div>
            <div class="order-meta">
              <div class="order-ref">#${order.order_ref}</div>
              <div class="order-time">${ageStr}</div>
              <div class="status-badge status-${order.status}">${order.status}</div>
            </div>
          </div>
          <div class="order-items">
            ${order.items.map(item => `
              <div class="order-item-row">
                <span class="item-qty">${item.quantity}×</span>
                <span class="item-label">${item.name}</span>
                ${item.notes ? `<span class="item-notes">${item.notes}</span>` : ''}
              </div>
            `).join('')}
            ${order.notes ? `<div style="margin-top:8px;font-size:12px;color:#f5a623;font-style:italic">📝 ${order.notes}</div>` : ''}
          </div>
          <div class="order-actions">
            ${getActionButtons(order)}
          </div>
        </div>
      `;
    }).join('');
  }

  function getActionButtons(order) {
    const next = {
      'new': ['accepted', '✓ Accept', 'btn-accept'],
      'accepted': ['preparing', '🔥 Start Cooking', 'btn-prepare'],
      'preparing': ['ready', '🔔 Mark Ready', 'btn-ready'],
      'ready': ['served', '✅ Served', 'btn-served'],
    };
    const n = next[order.status];
    if (!n) return '<span style="color:var(--muted);font-size:13px">Completed</span>';
    return `<button class="action-btn ${n[2]}" onclick="updateStatus(${order.id},'${n[0]}')">${n[1]}</button>`;
  }

  async function updateStatus(orderId, status) {
    const card = document.getElementById('oc-' + orderId);
    if (card) card.style.opacity = '0.5';

    await fetch(`/api/orders/${orderId}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    loadOrders();
  }

  function filterStatus(filter, el) {
    currentFilter = filter;
    document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadOrders();
  }

  // Initial load + poll fallback
  loadOrders();
  setInterval(loadOrders, 10000);
</script>
</body>
</html>
